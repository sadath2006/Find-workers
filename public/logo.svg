<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Outer Shield Gradient (Deep Blue -> Cyan -> Emerald Green) -->
    <linearGradient id="shieldBorderGrad" x1="10%" y1="5%" x2="90%" y2="95%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#06b6d4" />
      <stop offset="70%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Inner Shield Gradient -->
    <linearGradient id="innerShieldGrad" x1="10%" y1="5%" x2="90%" y2="95%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="50%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow Filter for Scan Beam -->
    <filter id="cyanGlow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Map Pin Gradient -->
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Route Line Gradient -->
    <linearGradient id="networkLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- 1. Hexagon Shield Outer Frame -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Heavy Shield (Rounded Hexagon Curve) -->
    <path d="M 256,42 L 418,80 C 436,238 256,470 256,470 C 256,470 76,238 94,80 Z" stroke="url(#shieldBorderGrad)" stroke-width="18" />
    
    <!-- Inner Parallel Shield Border -->
    <path d="M 256,64 L 398,98 C 414,232 256,446 256,446 C 256,446 98,232 114,98 Z" stroke="url(#innerShieldGrad)" stroke-width="6" opacity="0.95" />
  </g>

  <!-- 2. Biometric 3D Wireframe Face Mesh (Dark Blue/Teal Lines) -->
  <g fill="none" stroke="#0284c7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Face Contour Polygon -->
    <polygon points="175,135 256,120 337,135 357,180 347,240 327,300 292,335 256,345 220,335 185,300 165,240 155,180" />
    
    <!-- Forehead & Center Bridge Structure -->
    <polyline points="175,135 215,155 256,145 297,155 337,135" />
    <line x1="256" y1="120" x2="256" y2="145" />
    <line x1="215" y1="155" x2="256" y2="180" />
    <line x1="297" y1="155" x2="256" y2="180" />
    <line x1="215" y1="155" x2="185" y2="180" />
    <line x1="297" y1="155" x2="327" y2="180" />

    <!-- Eye Wireframe Sockets -->
    <polygon points="185,180 220,180 210,200 180,195" />
    <polygon points="327,180 292,180 302,200 332,195" />

    <!-- Nose Bridge & Tip -->
    <polygon points="256,180 242,225 256,243 270,225" fill="#0284c7" fill-opacity="0.15" />
    <line x1="210" y1="200" x2="242" y2="225" />
    <line x1="302" y1="200" x2="270" y2="225" />

    <!-- Cheekbones & Jaw Lines -->
    <line x1="165" y1="240" x2="210" y2="200" />
    <line x1="347" y1="240" x2="302" y2="200" />
    <line x1="165" y1="240" x2="242" y2="225" />
    <line x1="347" y1="240" x2="270" y2="225" />
    <line x1="185" y1="300" x2="242" y2="275" />
    <line x1="327" y1="300" x2="270" y2="275" />

    <!-- Mouth & Chin Contour -->
    <polygon points="230,275 256,265 282,275 270,290 256,293 242,290" fill="#0284c7" fill-opacity="0.2" />
    <line x1="256" y1="243" x2="256" y2="265" />
    <line x1="256" y1="293" x2="256" y2="345" />
    <line x1="242" y1="290" x2="220" y2="335" />
    <line x1="270" y1="290" x2="292" y2="335" />
  </g>

  <!-- 3. Glowing Horizontal Laser Scan Beam across Eye Region -->
  <g filter="url(#cyanGlow)">
    <!-- Cyan Scan Glow Region -->
    <polygon points="120,210 392,210 410,220 102,220" fill="#06b6d4" opacity="0.3" />
    <!-- Bright Cyan/Green Laser Scan Line -->
    <line x1="110" y1="215" x2="402" y2="215" stroke="#00f0ff" stroke-width="5.5" stroke-linecap="round" />
    <!-- 4 Glowing Scan Node Circles -->
    <circle cx="170" cy="215" r="5" fill="#ffffff" stroke="#00f0ff" stroke-width="3" />
    <circle cx="225" cy="215" r="5" fill="#ffffff" stroke="#00f0ff" stroke-width="3" />
    <circle cx="287" cy="215" r="5" fill="#ffffff" stroke="#00f0ff" stroke-width="3" />
    <circle cx="342" cy="215" r="5" fill="#ffffff" stroke="#00f0ff" stroke-width="3" />
  </g>

  <!-- 4. Location Map Pins & Network Connection Graph (Bottom Shield Area) -->
  <g>
    <!-- Route Connection Polyline -->
    <polyline points="152,390 190,360 238,385 285,345 325,380 358,358" fill="none" stroke="url(#networkLineGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Route Node Points -->
    <circle cx="190" cy="360" r="5.5" fill="#0284c7" stroke="#ffffff" stroke-width="2" />
    <circle cx="238" cy="385" r="5.5" fill="#10b981" stroke="#ffffff" stroke-width="2" />
    <circle cx="285" cy="345" r="5.5" fill="#06b6d4" stroke="#ffffff" stroke-width="2" />

    <!-- Left Map Location Pin -->
    <g transform="translate(148, 355)">
      <path d="M 0,-22 C -10,-22 -16,-14 -16,-4 C -16,8 0,20 0,20 C 0,20 16,8 16,-4 C 16,-14 10,-22 0,-22 Z" fill="url(#pinGradient)" stroke="#ffffff" stroke-width="2" />
      <circle cx="0" cy="-6" r="5" fill="#ffffff" />
    </g>

    <!-- Right Map Location Pin -->
    <g transform="translate(362, 325)">
      <path d="M 0,-22 C -10,-22 -16,-14 -16,-4 C -16,8 0,20 0,20 C 0,20 16,8 16,-4 C 16,-14 10,-22 0,-22 Z" fill="url(#shieldBorderGrad)" stroke="#ffffff" stroke-width="2" />
      <circle cx="0" cy="-6" r="5" fill="#ffffff" />
    </g>
  </g>
</svg>
