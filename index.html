<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#DC2626" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Find My Workers" />
    <meta name="application-name" content="Find My Workers" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo-512.png" />
    <link rel="shortcut icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Find My Workers</title>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-red-500 selection:text-white">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg, #dc2626 0%, #b91c1c 50%, #991b1b 100%); color: white; font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 20px;">
        <div style="margin-bottom: 24px; animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;">
          <img src="/Logo.png" alt="Find My Workers" style="width: 96px; height: 96px; object-fit: contain;" onerror="this.onerror=null;this.src='/logo.png';" />
        </div>
        <h1 style="font-size: 28px; font-weight: 900; letter-spacing: -0.025em; margin: 0 0 8px 0;">Find My Workers</h1>
        <p style="font-size: 13px; color: #fee2e2; margin: 0 0 32px 0;">Biometric Local Worker Network</p>
        <div style="display: inline-flex; align-items: center; gap: 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; color: #fee2e2;">
          <svg style="width: 18px; height: 18px; animation: spin 1s linear infinite;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
          </svg>
          <span>Starting application...</span>
        </div>
      </div>
      <style>
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 50% { opacity: .7; } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
